[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.23"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

fs_permissions = [
  { access = "read", path = "./deployments" },
  { access = "read", path = "../deployments" },
  { access = "read", path = "./test/vectors" }
]

[fuzz]
runs = 1000
