[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.23"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

fs_permissions = [
  { access = "read", path = "./deployments" },
  { access = "read", path = "../deployments" },
  { access = "read", path = "./test/vectors" }
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 64, fail_on_revert = false }
